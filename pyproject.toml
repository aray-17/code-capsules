[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-capsules"
version = "0.1.0"
description = "Calibrated cost-quality configuration for single-session coding agents"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aninda Ray", email = "research@anindaray.com" },
]
keywords = [
    "llm", "coding-agents", "swe-bench", "cost-quality", "agent-framework",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml",          # the only hard dependency (policy DSL); raises a clear error if absent
]

[project.urls]
Homepage = "https://github.com/aray-17/code-capsules"
Source = "https://github.com/aray-17/code-capsules"
Issues = "https://github.com/aray-17/code-capsules/issues"

[project.optional-dependencies]
# Vendor model SDKs are imported lazily by the adapters; install only what you use.
anthropic = ["anthropic"]
openai = ["openai"]
gemini = ["google-genai"]
swebench = ["docker"]   # the SWE-bench Docker evaluation path (benchmarks/)
dev = [
    "pytest",
    "pytest-asyncio",
    "anthropic",
    "openai",
    "google-genai",
    "human-eval",
]

[tool.hatch.build.targets.wheel]
packages = ["src/code_capsules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: marks tests that require real API keys (skip with -m 'not integration')",
    "benchmark: marks tests that run SWE-bench or HumanEval evals",
    "slow: marks slow tests that require Docker + image pulls (run with -m slow)",
]
